<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calibration System</title>
  <link rel="stylesheet" href="/ui/css/theme.css">
  <link rel="stylesheet" href="/ui/css/search.css">
</head>
<body>
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card">
      <h1>Calibration System</h1>
      <p class="muted">Sign in to continue</p>
      <label>Username
        <input id="login-username" autocomplete="username" required>
      </label>
      <label>Password
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-button" type="submit" class="primary">Sign in</button>
    </form>
  </section>

  <div id="app-view" class="shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/dashboard">Calibration System</a>
        <nav id="nav" aria-label="Main"></nav>
        <form id="global-search" class="global-search" role="search">
          <input id="global-search-input" type="search" placeholder="Find by code  ( / )"
                 aria-label="Find equipment by code" autocomplete="off" maxlength="50">
        </form>
        <div class="topbar-user">
          <span id="user-info" class="user-info"></span>
          <button id="logout-button" type="button" class="small">Sign out</button>
        </div>
      </div>
    </header>
    <main class="content">
      <div id="view"></div>
    </main>
  </div>

  <script type="module" src="/ui/js/app.js"></script>
  <script type="module" src="/ui/js/search.js"></script>
</body>
</html>
